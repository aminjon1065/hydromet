name: hydromet-portal

services:
  nginx:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    healthcheck:
      # Ask PHP-FPM to actually serve its status page, so a pool that is
      # listening but unable to answer is reported unhealthy.
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/fpm-status SCRIPT_FILENAME=/fpm-status
          REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=1"]
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hydromet}"
      POSTGRES_USER: "${DB_USERNAME:-hydromet}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      # Deterministic collation, so ordering does not depend on the host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Loopback only. The app, queue and scheduler containers reach
      # PostgreSQL as `postgres:5432` over the internal Compose network;
      # this mapping exists solely for local tools such as psql.
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a major-version subdirectory and
      # refuse to start when the volume is mounted at the old
      # /var/lib/postgresql/data path, so the mount is one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USERNAME:-hydromet}\" -d \"${DB_DATABASE:-hydromet}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only. Containers reach Redis as `redis:6379` over the
      # internal Compose network; this mapping is for local tooling.
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
