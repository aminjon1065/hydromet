server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # The portal is served over HTTPS on the VPS; the TLS terminator adds HSTS.
    #
    # These are repeated in every location that declares an add_header of its
    # own: nginx inherits add_header from an outer level only while the inner
    # level declares none at all, so a single Cache-Control below would
    # otherwise silently drop all of them for the built assets.
    include /etc/nginx/snippets/security-headers.conf;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;

        # The application sets the same headers so the guarantee does not depend
        # on this file, but nginx appends rather than replaces: two identical
        # X-Content-Type-Options values are read as one invalid value and the
        # protection is lost. Drop the upstream copies and let the edge win.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header X-Permitted-Cross-Domain-Policies;

        internal;
    }

    # Never execute or expose other PHP files or dot-files.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
