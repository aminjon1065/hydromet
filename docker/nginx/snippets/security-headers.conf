# Static response headers required on every response nginx emits.
#
# Kept in a snippet because nginx does not inherit add_header into a location
# that declares one of its own, so each such location has to repeat the whole
# set. The application repeats them too (App\Http\Middleware\SecurityHeaders);
# the PHP location hides the upstream copies so a client never sees a header
# twice.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
